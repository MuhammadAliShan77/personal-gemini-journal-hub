    <script>
      // Safeguard against 'Cannot set property fetch of #<Window> which has only a getter'
      (function () {
        try {
          var rawFetch = window.fetch;
          var currentFetch = function () {
            return (rawFetch || fetch).apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return currentFetch;
            },
            set: function (fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || (typeof Window !== 'undefined' && Window.prototype);
            if (proto) {
              var pRaw = window.fetch;
              var pCur = function () {
                return (pRaw || fetch).apply(window, arguments);
              };
              Object.defineProperty(proto, 'fetch', {
                get: function () {
                  return pCur;
                },
                set: function (fn) {
                  pCur = fn;
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (err) {
            console.warn('[ReflectAI] Fetch property handler warning:', err);
          }
        }
      })();
    </script>
